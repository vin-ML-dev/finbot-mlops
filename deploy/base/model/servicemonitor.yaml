# Tells Prometheus (component 4) to scrape the model's /metrics endpoint.
# The `release: kps` label is what the kube-prometheus-stack Prometheus selects on.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: llama-cpp
  namespace: finbot
  labels:
    release: kps
spec:
  selector:
    matchLabels:
      app: llama-cpp
  namespaceSelector:
    matchNames:
      - finbot
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
