kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: finbot
nodes:
  # ---- Node A : control-plane + infra/monitoring ----
  - role: control-plane
    labels:
      node-role: infra
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          taints: []          # clear kind's default control-plane NoSchedule taint
    extraPortMappings:
      - containerPort: 80
        hostPort: 8080
        protocol: TCP
      - containerPort: 443
        hostPort: 8443
        protocol: TCP

  # ---- Node B : model (labeled + tainted at creation) ----
  - role: worker
    labels:
      node-role: model
    kubeadmConfigPatches:
      - |
        kind: JoinConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "node-role=model"
          taints:
            - key: "dedicated"
              value: "model"
              effect: "NoSchedule"

  # ---- Node C : agent (labeled + tainted at creation) ----
  - role: worker
    labels:
      node-role: agent
    kubeadmConfigPatches:
      - |
        kind: JoinConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "node-role=agent"
          taints:
            - key: "dedicated"
              value: "agent"
              effect: "NoSchedule"
