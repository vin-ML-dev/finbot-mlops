# AlertmanagerConfig — routing + the Slack receiver, with STATE-AWARE templates.
#
# Key lesson baked in: the template applies to EVERY alert routed to this
# receiver, and it must gate BOTH the title AND the body on .Status. Otherwise
# a RESOLVED notification still reads "is down". We branch on .Status ("firing"
# vs "resolved") so resolved messages say "Resolved", and we never hardcode one
# alert's wording — we render each alert's own annotations.
#
# The Slack webhook comes from the sealed alertmanager-slack secret (re-enabled
# in component 4). kube-prometheus-stack mounts it; here we reference it.
apiVersion: monitoring.coreos.com/v1alpha1
kind: AlertmanagerConfig
metadata:
  name: finbot-alertmanager
  namespace: monitoring
  labels:
    release: kps
spec:
  route:
    receiver: "slack-notifications"
    groupBy: ["alertname", "component"]
    groupWait: 30s
    groupInterval: 5m
    repeatInterval: 4h
    # send resolved notifications too, so the state-aware template matters
    routes:
      - receiver: "slack-notifications"
        matchers:
          - name: severity
            matchType: "=~"
            value: "critical|warning"
        continue: false

  receivers:
    - name: "slack-notifications"
      slackConfigs:
        - apiURL:
            # the sealed webhook, key `webhook` in secret alertmanager-slack
            name: alertmanager-slack
            key: webhook
          sendResolved: true
          # ----- STATE-AWARE title: branch on .Status -----
          title: |-
            {{ if eq .Status "firing" }}:rotating_light: FIRING{{ else }}:white_check_mark: RESOLVED{{ end }} — {{ .CommonLabels.alertname }}
          # ----- STATE-AWARE body: render EACH alert's own annotations -----
          text: |-
            {{ if eq .Status "firing" }}*Status:* Firing{{ else }}*Status:* Resolved{{ end }}
            {{ range .Alerts }}
            *Component:* {{ .Labels.component }}  *Severity:* {{ .Labels.severity }}
            *Summary:* {{ .Annotations.summary }}
            {{ if eq $.Status "firing" }}*Detail:* {{ .Annotations.description }}{{ else }}*Detail:* This condition has cleared.{{ end }}
            {{ end }}
