# Child app (wave 0): the Sealed Secrets CONTROLLER.
#
# This installs the controller that decrypts SealedSecrets inside the cluster.
# It MUST be healthy before any encrypted secret (sealed-secret-manifests app)
# syncs — hence wave 0 (earlier than the secrets themselves at wave 1).
#
# The controller holds a private key; SealedSecrets are encrypted with the
# matching public key so they're safe to commit to Git. Only THIS controller,
# in THIS cluster, can decrypt them.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sealed-secrets-controller
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: finbot
  source:
    repoURL: "ghcr.io/bitnami-labs/sealed-secrets"
    chart: sealed-secrets
    targetRevision: 2.16.1        # chart version (controller app-version ~0.27)
    helm:
      releaseName: sealed-secrets
      values: |
        fullnameSitename: sealed-secrets
        # install the controller into kube-system (its conventional home)
        namespace: kube-system
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
