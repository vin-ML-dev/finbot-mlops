# Child app (wave 1): the encrypted SealedSecret objects.
#
# These are the ACTUAL secrets (HF token, gateway key, Slack webhook), encrypted
# so they're safe in Git. Argo syncs them into the finbot namespace; the
# controller (wave 0) then decrypts each SealedSecret into a real Secret that the
# model / gateway / agent pods consume.
#
# wave 1 so it runs AFTER the controller is up (wave 0) — otherwise the
# SealedSecret CRD wouldn't exist yet.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sealed-secret-manifests
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: finbot
  source:
    repoURL: "https://github.com/vin-ML-dev/finbot-mlops.git"
    targetRevision: main
    path: secrets/sealed
  destination:
    server: https://kubernetes.default.svc
    namespace: finbot
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
